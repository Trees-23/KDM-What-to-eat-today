services:
  backend:
    environment:
      ENABLE_RAG_AUDIT: "true"
      RAG_AUDIT_ROOT_DIR: "/app/run/exam-audits/${EXAM_RUN_ID:-unassigned}"
      RAG_EXPERIMENT_ID: "${EXAM_RUN_ID:-unassigned}"
      RAG_VARIANT_NAME: "${EXAM_VARIANT:-unknown}"
      RETRIEVAL_NEW_PATH_TRAFFIC_PERCENT: "${EXAM_NEW_PATH_TRAFFIC_PERCENT:-0}"
      RETRIEVAL_ENTITY_DIRECT_ENABLED: "${EXAM_ENTITY_DIRECT_ENABLED:-false}"
      RETRIEVAL_QUERY_PLAN_ENABLED: "${EXAM_QUERY_PLAN_ENABLED:-false}"
      RETRIEVAL_TARGETED_GRAPH_ENABLED: "${EXAM_TARGETED_GRAPH_ENABLED:-false}"
      RETRIEVAL_MILVUS_V2_ENABLED: "${EXAM_MILVUS_V2_ENABLED:-false}"
      RETRIEVAL_PARENT_STORE_ENABLED: "${EXAM_PARENT_STORE_ENABLED:-false}"
      RETRIEVAL_MILVUS_DATABASE: "${EXAM_MILVUS_DATABASE:-default}"
      RETRIEVAL_MILVUS_COLLECTION: "${EXAM_MILVUS_COLLECTION:-}"
      RETRIEVAL_LEGACY_FALLBACK_ENABLED: "${EXAM_LEGACY_FALLBACK_ENABLED:-true}"
