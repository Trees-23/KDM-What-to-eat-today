# 今天吃什么 - AI美食推荐助手
# Docker Compose 配置文件

services:
  # Neo4j 图数据库
  neo4j:
    image: neo4j:5.11-community
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use_neo4j_config=true
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/cypher:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 300s
    restart: unless-stopped

  # Milvus 向量数据库依赖服务
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Milvus 向量数据库
  milvus-standalone:
    image: milvusdb/milvus:v2.3.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      # Milvus config keys are minio.accessKeyID and minio.secretAccessKey.
      MINIO_ACCESSKEYID: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_SECRETACCESSKEY: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 仅管理本 Compose 专属 Neo4j 卷；源 CSV 变更时从头重建图，避免遗留删除的数据。
  neo4j-bootstrap:
    image: neo4j:5.11-community
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    volumes:
      - ./data/cypher:/import:ro
      - ./scripts/docker/neo4j-bootstrap.sh:/bootstrap/neo4j-bootstrap.sh:ro
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["bash", "/bootstrap/neo4j-bootstrap.sh"]
    restart: "no"

  # 从已导入的图构建 PDS、向量与活动 manifest；首启会下载嵌入模型。
  retrieval-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,neo4j,milvus-standalone}
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - HF_HOME=/models
      - SENTENCE_TRANSFORMERS_HOME=/models
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,neo4j,milvus-standalone}
    user: "0:0"
    volumes:
      - runtime_data:/app/run
      - model_cache:/models
    depends_on:
      neo4j-bootstrap:
        condition: service_completed_successfully
      milvus-standalone:
        condition: service_healthy
    command:
      - sh
      - scripts/docker/run-retrieval-bootstrap.sh
      - --neo4j-uri
      - bolt://neo4j:7687
      - --neo4j-user
      - ${NEO4J_USER:-neo4j}
      - --neo4j-password
      - ${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      - --neo4j-database
      - ${NEO4J_DATABASE:-neo4j}
      - --milvus-uri
      - http://milvus-standalone:19530
      - --milvus-database
      - default
      - --output-dir
      - /app/run/retrieval
      - --embedding-model
      - ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
    restart: "no"

  # Python 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,neo4j,milvus-standalone}
    environment:
      - PYTHONPATH=/app
      - DOCKER_ENV=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      # 模型配置
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - LLM_MODEL=${LLM_MODEL:-moonshot-v1-8k}
      - ENABLE_RERANK=${ENABLE_RERANK:-false}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-base}
      - ENABLE_RAG_AUDIT=${ENABLE_RAG_AUDIT:-false}
      - RAG_AUDIT_MAX_CONTENT_CHARS=${RAG_AUDIT_MAX_CONTENT_CHARS:-4000}
      - RAG_EXPERIMENT_ID=${RAG_EXPERIMENT_ID:-baseline}
      - RAG_VARIANT_NAME=${RAG_VARIANT_NAME:-default}
      # 推荐约束与重排：只使用已切换的 PDS/Milvus 联合工件。
      - RETRIEVAL_PARENT_STORE_ENABLED=true
      - RETRIEVAL_QUERY_PLAN_ENABLED=true
      - RETRIEVAL_TARGETED_GRAPH_ENABLED=true
      - RETRIEVAL_MILVUS_V2_ENABLED=true
      - RETRIEVAL_INTENT_PLANNER_ENABLED=true
      - RETRIEVAL_NEW_PATH_TRAFFIC_PERCENT=100
      - RETRIEVAL_RECOMMENDATION_CONSTRAINTS_ENABLED=true
      - RETRIEVAL_MILVUS_DATABASE=default
      - HF_HOME=/models
      - SENTENCE_TRANSFORMERS_HOME=/models
      # 活动 collection 由 retrieval_artifact_manifest.json 原子发布；如显式设置，
      # 仅用于和 manifest 交叉校验，避免 Compose 固化某个过期 build。
      # 统一API配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:?请在 .env 设置 OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.moonshot.cn/v1}
      # 允许本地受限网络通过宿主代理访问模型服务。
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,neo4j,milvus-standalone}
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/run
      - model_cache:/models
    depends_on:
      retrieval-bootstrap:
        condition: service_completed_successfully
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Next.js 前端服务
  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        target: runner
        args:
          HTTP_PROXY: ${HTTP_PROXY:-}
          HTTPS_PROXY: ${HTTPS_PROXY:-}
          ALL_PROXY: ${ALL_PROXY:-}
          NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,neo4j,milvus-standalone}
      environment:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - HOSTNAME=0.0.0.0
        - HOST=0.0.0.0
      ports:
        - "3000:3000"
      depends_on:
        backend:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
      restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  runtime_data:
  model_cache:
