name: 检索渐进发布监控

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-and-evaluate:
    runs-on: ubuntu-latest
    environment: retrieval-rollout-protected
    env:
      METRICS_SOURCE: ${{ vars.RETRIEVAL_METRICS_SOURCE }}
      METRICS_ROOT: ${{ vars.RETRIEVAL_METRICS_ROOT }}
      ARTIFACT_DIR: ${{ runner.temp }}/retrieval-rollout-artifacts
      VARIANT: ${{ vars.RETRIEVAL_VARIANT }}
      CONFIG_HASH: ${{ vars.RETRIEVAL_CONFIG_HASH }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 采集已授权指标
        continue-on-error: true
        run: >-
          python scripts/monitor_retrieval_rollout.py --once
          --metrics-source "$METRICS_SOURCE"
          --allowed-metrics-root "$METRICS_ROOT"
          --variant "$VARIANT"
          --config-hash "$CONFIG_HASH"
          --artifact-dir "$ARTIFACT_DIR"
      - name: 评估观察窗口
        continue-on-error: true
        run: >-
          python scripts/monitor_retrieval_rollout.py --evaluate
          --artifact-dir "$ARTIFACT_DIR"
          --thresholds eval/retrieval_release_thresholds.yaml
          --window-days 7
          --min-requests 100
      - name: 保存不可变监控工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-rollout-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-rollout-artifacts
          retention-days: 30
